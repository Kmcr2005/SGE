<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2f48"/>
      <stop offset="50%" stop-color="#122234"/>
      <stop offset="100%" stop-color="#0b1623"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c"/>
      <stop offset="100%" stop-color="#c79a46"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(199,154,70,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="url(#grid)"/>
  
  <!-- Outer Decorative Rings -->
  <circle cx="300" cy="320" r="210" fill="none" stroke="rgba(199,154,70,0.12)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="320" r="165" fill="none" stroke="rgba(199,154,70,0.2)" stroke-width="2"/>
  
  <!-- Geospatial Coordinate Crosshairs -->
  <line x1="300" y1="90" x2="300" y2="120" stroke="#c79a46" stroke-width="2" opacity="0.6"/>
  <line x1="300" y1="520" x2="300" y2="550" stroke="#c79a46" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="320" x2="100" y2="320" stroke="#c79a46" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="320" x2="530" y2="320" stroke="#c79a46" stroke-width="2" opacity="0.6"/>
  
  <!-- Avatar Center Shield/Badge -->
  <circle cx="300" cy="320" r="125" fill="#16283d" stroke="url(#goldGrad)" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))"/>
  
  <!-- Monogram Initials -->
  <text x="300" y="348" font-family="Cinzel, serif, Georgia" font-size="76" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">TV</text>
  
  <!-- Bottom SGE Emblem Badge -->
  <rect x="180" y="580" width="240" height="36" rx="18" fill="rgba(199,154,70,0.12)" stroke="rgba(199,154,70,0.3)" stroke-width="1"/>
  <text x="300" y="603" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#dfb76c" text-anchor="middle" letter-spacing="3">SGE · CEG ANNA UNIV</text>
</svg>